
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            color: #222;
        }

        header {
            background: #263f91;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin-bottom: 10px;
            font-size: 30px;
        }

        header p {
            color: #e0e7ff;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h2 {
            color: #263f91;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: bold;
        }

        input, select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            width: 100%;
        }

        input:focus, select:focus {
            outline: 2px solid #a5b4fc;
            border-color: #263f91;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .register-btn {
            background: #263f91;
            color: white;
        }

        .clear-btn {
            background: #e5e7eb;
            color: #222;
        }

        .register-btn:hover {
            background: #182b68;
        }

        .student-section {
            margin-top: 35px;
        }

        .summary {
            background: #e8edff;
            padding: 15px;
            border-radius: 8px;
            margin: 18px 0;
            font-weight: bold;
        }

        .search {
            margin-bottom: 15px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #263f91;
            color: white;
        }

        tr:nth-child(even) {
            background: #f4f6ff;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            margin: 2px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            margin: 2px;
        }

        .empty {
            text-align: center;
            color: #666;
        }

        footer {
            background: #263f91;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                margin: 15px;
                padding: 18px;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student Registration System</h1>
    <p>Student Details Management Portal</p>
</header>

<main class="container">

    <section>
        <h2>Register New Student</h2>

        <form id="studentForm">
            <div class="form-grid">

                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName"
                           placeholder="Enter student name" required>
                </div>

                <div class="form-group">
                    <label for="rollNumber">Roll Number</label>
                    <input type="text" id="rollNumber"
                           placeholder="Enter roll number" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                           placeholder="Enter email address" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone"
                           placeholder="10-digit phone number"
                           pattern="[0-9]{10}" maxlength="10" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option>Female</option>
                        <option>Male</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" required>
                        <option value="">Select Course</option>
                        <option>B.Sc Computer Science</option>
                        <option>BCA</option>
                        <option>B.Com</option>
                        <option>BBA</option>
                        <option>B.Sc Mathematics</option>
                        <option>BA English</option>
                        <option>B.E Computer Science</option>
                    </select>
                </div>

            </div>

            <div class="buttons">
                <button type="submit" class="register-btn"
                        id="submitBtn">Register Student</button>
                <button type="reset" class="clear-btn">Clear Form</button>
            </div>
        </form>
    </section>

    <section class="student-section">
        <h2>Registered Students</h2>

        <input class="search" type="search" id="search"
               placeholder="Search by name or roll number..."
               aria-label="Search students">

        <div class="summary">
            Total Students: <span id="total">0</span>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Roll Number</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Gender</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    <p>Student Registration System | Mini Project</p>
    <p style="margin-top: 8px;">Developed using HTML, CSS and JavaScript</p>
</footer>

<script>
    const form = document.getElementById("studentForm");
    const studentTable = document.getElementById("studentTable");
    const total = document.getElementById("total");
    const search = document.getElementById("search");
    const submitBtn = document.getElementById("submitBtn");

    let students = [];

    try {
        const saved = JSON.parse(
            localStorage.getItem("studentRegistrationData") || "[]"
        );

        if (Array.isArray(saved)) {
            students = saved.filter(s =>
                s && typeof s.id === "string" &&
                typeof s.name === "string" &&
                typeof s.roll === "string"
            );
        }
    } catch (error) {
        students = [];
    }

    let editId = null;

    function saveData() {
        try {
            localStorage.setItem(
                "studentRegistrationData",
                JSON.stringify(students)
            );
            return true;
        } catch (error) {
            alert("Unable to save data in this browser.");
            return false;
        }
    }

    function createCell(value) {
        const cell = document.createElement("td");
        cell.textContent = value;
        return cell;
    }

    function displayStudents() {
        studentTable.replaceChildren();

        const keyword = search.value.trim().toLowerCase();

        const filtered = students.filter(s =>
            s.name.toLowerCase().includes(keyword) ||
            s.roll.toLowerCase().includes(keyword)
        );

        total.textContent = students.length;

        if (filtered.length === 0) {
            const row = document.createElement("tr");
            const cell = createCell("No student records found.");
            cell.colSpan = 7;
            cell.className = "empty";
            row.appendChild(cell);
            studentTable.appendChild(row);
            return;
        }

        filtered.forEach(s => {
            const row = document.createElement("tr");

            row.appendChild(createCell(s.roll));
            row.appendChild(createCell(s.name));
            row.appendChild(createCell(s.email));
            row.appendChild(createCell(s.phone));
            row.appendChild(createCell(s.gender));
            row.appendChild(createCell(s.course));

            const actions = document.createElement("td");

            const edit = document.createElement("button");
            edit.type = "button";
            edit.textContent = "Edit";
            edit.className = "edit-btn";
            edit.addEventListener("click", () => editStudent(s.id));

            const del = document.createElement("button");
            del.type = "button";
            del.textContent = "Delete";
            del.className = "delete-btn";
            del.addEventListener("click", () => deleteStudent(s.id));

            actions.append(edit, del);
            row.appendChild(actions);
            studentTable.appendChild(row);
        });
    }

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const student = {
            id: editId || (
                crypto.randomUUID
                    ? crypto.randomUUID()
                    : Date.now().toString() + Math.random()
            ),
            name: document.getElementById("studentName").value.trim(),
            roll: document.getElementById("rollNumber").value.trim(),
            email: document.getElementById("email").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            gender: document.getElementById("gender").value,
            course: document.getElementById("course").value
        };

        const duplicate = students.some(s =>
            s.roll.toLowerCase() === student.roll.toLowerCase() &&
            s.id !== editId
        );

        if (duplicate) {
            alert("This roll number is already registered.");
            return;
        }

        const previous = [...students];

        if (editId) {
            students = students.map(s =>
                s.id === editId ? student : s
            );
        } else {
            students.push(student);
        }

        if (!saveData()) {
            students = previous;
            return;
        }

        alert(editId
            ? "Student details updated successfully!"
            : "Student registered successfully!");

        editId = null;
        form.reset();
        submitBtn.textContent = "Register Student";
        displayStudents();
    });

    function editStudent(id) {
        const s = students.find(student => student.id === id);
        if (!s) return;

        editId = id;

        document.getElementById("studentName").value = s.name;
        document.getElementById("rollNumber").value = s.roll;
        document.getElementById("email").value = s.email;
        document.getElementById("phone").value = s.phone;
        document.getElementById("gender").value = s.gender;
        document.getElementById("course").value = s.course;

        submitBtn.textContent = "Update Student";
        form.scrollIntoView({ behavior: "smooth" });
    }

    function deleteStudent(id) {
        if (!confirm("Do you want to delete this student?")) return;

        const previous = [...students];
        students = students.filter(s => s.id !== id);

        if (!saveData()) {
            students = previous;
            return;
        }

        if (editId === id) {
            editId = null;
            form.reset();
            submitBtn.textContent = "Register Student";
        }

        displayStudents();
    }

    form.addEventListener("reset", function() {
        editId = null;
        submitBtn.textContent = "Register Student";
    });

    search.addEventListener("input", displayStudents);

    displayStudents();
</script>

</body>
</html>
